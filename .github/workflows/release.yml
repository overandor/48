name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build Python package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Build Solana program
        run: |
          cargo build-bpf --manifest-path programs/solana_dex/Cargo.toml
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Semantic Protocol Runtime Release ${{ steps.version.outputs.version }}
            
            ### Changes
            - See CHANGELOG.md for details
            
            ### Installation
            ```bash
            pip install semantic-protocol-runtime==${{ steps.version.outputs.version }}
            ```
            
            ### Documentation
            - Full documentation available at: https://overandor.github.io/48/
          files: |
            dist/*
            programs/solana_dex/target/deploy/*.so
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: create-release
    environment:
      name: pypi
      url: https://pypi.org/p/semantic-protocol-runtime
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            overandor/semantic-protocol-runtime:latest
            overandor/semantic-protocol-runtime:${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=overandor/semantic-protocol-runtime:buildcache
          cache-to: type=registry,ref=overandor/semantic-protocol-runtime:buildcache,mode=max
